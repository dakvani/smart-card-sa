name: Mobile Dashboard Screenshots

on:
  pull_request:
    paths:
      - "src/pages/Dashboard.tsx"
      - "src/components/dashboard/**"
      - "e2e/dashboard-mobile.spec.ts"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Provide these as GitHub Secrets to enable authenticated capture:
      E2E_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}
      E2E_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build + preview server
        run: |
          bun run build
          bunx vite preview --port 8080 --strictPort &
          npx --yes wait-on http://localhost:8080
      - name: Run mobile dashboard screenshots
        run: bunx playwright test e2e/dashboard-mobile.spec.ts --reporter=list
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-mobile-screenshots
          path: .artifacts/dashboard-mobile/**
          if-no-files-found: warn
